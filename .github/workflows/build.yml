name: Build Kernel Poco X3 Pro (NTSync + KSU-Next)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libbison-dev flex libelf-dev zip unzip ccache libssl-dev git curl wget

    - name: Download Toolchain (AOSP Clang r416183b)
      run: |
        mkdir -p clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r34/clang-r416183b.tar.gz
        tar -xf clang-r416183b.tar.gz -C clang
        rm clang-r416183b.tar.gz

    - name: Setup KernelSU-Next
      run: |
        curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

    - name: Build Kernel
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        make O=out vayu_defconfig
        make -j$(nproc --all) O=out LLVM=1 LLVM_IAS=1

    - name: Prepare AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1
        cp out/arch/arm64/boot/Image AnyKernel3/
        cp out/arch/arm64/boot/dtb.img AnyKernel3/ 2>/dev/null || cp out/arch/arm64/boot/dts/qcom/*.dtb AnyKernel3/dtb 2>/dev/null || true
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/ 2>/dev/null || true
        
        sed -i 's/kernel.string=.*/kernel.string=Anymore Kernel NTSync + KSU/g' AnyKernel3/anykernel.sh
        sed -i 's/device.name1=.*/device.name1=vayu/g' AnyKernel3/anykernel.sh
        sed -i 's/device.name2=.*/device.name2=bhima/g' AnyKernel3/anykernel.sh
        sed -i 's|BLOCK=.*|BLOCK=boot;|g' AnyKernel3/anykernel.sh
        
        cd AnyKernel3
        zip -r1 ../Anymore-NTSync-KSU-Vayu.zip ./*

    - name: Upload Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: Anymore-NTSync-KSU-Vayu
        path: Anymore-NTSync-KSU-Vayu.zip
