name: Build Kernel

on:
  push:
    branches: [ "16" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y build-essential gcc-aarch64-linux-gnu libssl-dev bc flex bison libncurses5-dev libncursesw5-dev

    - name: Download Toolchain (AOSP Clang r416183b)
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b toolchain

    - name: Build Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        make O=out ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- vayu_defconfig vendor/xiaomi/vayu.config
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu-

    - name: Prepare AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1
        cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r1 ../Anymore-NTSync-Vayu.zip *

    - name: Upload Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: Anymore-NTSync-Vayu
        path: Anymore-NTSync-Vayu.zip
