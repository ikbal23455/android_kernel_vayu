name: Build Anymore Kernel (Git Clone + NTSync + KSU-Next + SuSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libbison-dev flex libelf-dev zip ccache git curl wget clang llvm lld

      - name: Inject KSU-Next & SuSFS via Git
        run: |
          # 1. Clone KernelSU-Next ke drivers/kernelsu
          rm -rf drivers/kernelsu
          git clone https://github.com/rifs33/KernelSU-Next.git drivers/kernelsu -b next
          
          # 2. Clone SuSFS v2.2.0 khusus kernel 4.14
          rm -rf susfs
          git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs -b kernel-4.14
          
          # 3. Terapkan Patch SuSFS ke Source Kernel
          cp susfs/kernel_patches/50_add_susfs_in_kernel-4.14.patch .
          cp -r susfs/kernel_patches/fs/* fs/
          cp -r susfs/kernel_patches/include/linux/* include/linux/
          patch -p1 < 50_add_susfs_in_kernel-4.14.patch

      - name: Configure Kernel Options
        run: |
          make O=out ARCH=arm64 vayu_user_defconfig
          
          # Paksa aktifkan NTSync dan fitur SuSFS/KSU
          scripts/config --file out/.config --enable CONFIG_NTSYNC
          scripts/config --file out/.config --enable CONFIG_KSU
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_PATH
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_OVERLAYFS
          
          make O=out ARCH=arm64 olddefconfig

      - name: Compile Kernel
        run: |
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz-dtb

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          
          sed -i 's/kernel.string=.*/kernel.string=Anymore Kernel NTSync + KSU-Next + SuSFS/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=vayu/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=bhima/g' AnyKernel3/anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=boot;|g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3
          zip -r9 ../Anymore-NTSync-KSU-SuSFS-Vayu.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anymore-NTSync-KSU-SuSFS-Vayu
          path: Anymore-NTSync-KSU-SuSFS-Vayu.zip
